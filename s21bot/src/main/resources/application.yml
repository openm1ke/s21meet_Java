server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

spring:
  application:
      name: s21bot
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${BOT_FEIGN_CONNECT_TIMEOUT_MS:5000}
            readTimeout: ${BOT_FEIGN_READ_TIMEOUT_MS:20000}

bot:
  token: ${BOT_TOKEN}
  admin: ${BOT_ADMIN}
  group: ${BOT_GROUP}
  group-invite-link: ${BOT_GROUP_INVITE_LINK}
  web-app-url: ${BOT_WEB_APP_URL:https://localhost:8085/}
  proxy:
    enabled: ${BOT_PROXY_ENABLED:false}
    type: ${BOT_PROXY_TYPE:SOCKS}
    host: ${BOT_PROXY_HOST:}
    port: ${BOT_PROXY_PORT:0}
  session:
    enabled: true
  page-size: 10
  notify:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      profileEdu:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${PROFILE_EDU_CB_SLIDING_WINDOW_SIZE:20}
        minimumNumberOfCalls: ${PROFILE_EDU_CB_MIN_CALLS:10}
        failureRateThreshold: ${PROFILE_EDU_CB_FAILURE_RATE_THRESHOLD:50}
        waitDurationInOpenState: ${PROFILE_EDU_CB_WAIT_OPEN:30s}
        permittedNumberOfCallsInHalfOpenState: ${PROFILE_EDU_CB_HALF_OPEN_CALLS:3}
  ratelimiter:
    instances:
      telegram:
        limitForPeriod: 25
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
  retry:
    instances:
      telegram:
        maxAttempts: 5
        waitDuration: 500ms
        ignoreExceptions:
          - org.telegram.telegrambots.meta.exceptions.TelegramApiRequestException
          - org.telegram.telegrambots.meta.exceptions.TelegramApiValidationException
      profileEdu:
        maxAttempts: ${PROFILE_EDU_RETRY_MAX_ATTEMPTS:3}
        waitDuration: ${PROFILE_EDU_RETRY_WAIT_DURATION:500ms}
        enableExponentialBackoff: ${PROFILE_EDU_RETRY_EXPONENTIAL_BACKOFF:true}
        exponentialBackoffMultiplier: ${PROFILE_EDU_RETRY_EXPONENTIAL_MULTIPLIER:2}
        retryExceptions:
          - feign.FeignException

logging:
  level:
    io.github.resilience4j: INFO

rocketchat:
  service:
    url: ${ROCKETCHAT_SERVICE_URL}

profile:
  service:
    url: ${PROFILE_SERVICE_URL}
