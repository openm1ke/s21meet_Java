name: SpotBugs

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: spotbugs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spotbugs:
    name: SpotBugs main sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: false

      - name: Run SpotBugs for main sources
        run: ./gradlew spotbugsMain --parallel --max-workers=4 --build-cache --configuration-cache
