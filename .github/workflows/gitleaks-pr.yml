name: Secret Scan PR

on:
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: gitleaks-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The action determines the PR commit range from the pull_request event.
          # Full history keeps the merge-base available after branch rebases.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
