spring:
  config:
    import:
      - optional:file:./env/test/s21auth.env[.properties]
      - optional:file:../env/test/s21auth.env[.properties]
      - optional:file:./env/local/s21auth.env[.properties]
      - optional:file:../env/local/s21auth.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:h2:file:${user.home}/.s21meet/h2/s21auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

app:
  h2:
    tcp:
      enabled: true
      port: ${H2_TCP_PORT:9093}
