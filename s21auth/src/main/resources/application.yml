server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

spring:
  datasource:
    url: jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

token:
  uri: ${TOKEN_URI}
  scheduler:
    enabled: true
    refresh-delay: 30000

security:
  crypto:
    key-base64: ${CRYPTO_KEY_BASE64}

resilience4j:
  circuitbreaker:
    instances:
      auth:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${AUTH_CB_SLIDING_WINDOW_SIZE:20}
        minimumNumberOfCalls: ${AUTH_CB_MIN_CALLS:10}
        failureRateThreshold: ${AUTH_CB_FAILURE_RATE_THRESHOLD:50}
        waitDurationInOpenState: ${AUTH_CB_WAIT_OPEN:30s}
        permittedNumberOfCallsInHalfOpenState: ${AUTH_CB_HALF_OPEN_CALLS:3}
  ratelimiter:
    instances:
      auth:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
  retry:
    instances:
      auth:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG

edu:
  login: ${EDU_LOGIN}
  password: ${EDU_PASS}

auth:
  client:
    connect-timeout: ${AUTH_CLIENT_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${AUTH_CLIENT_READ_TIMEOUT:PT20S}
